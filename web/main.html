<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Learn</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="main" id="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="Navegação">
            <div class="sidebar-topo">
                <div class="sidebar-brand">
                    <span class="sidebar-brand-mark" aria-hidden="true">R</span>
                    <div class="sidebar-brand-texto">
                        <p class="sidebar-logo">Road</p>
                        <p class="sidebar-logo-sub">Learn</p>
                    </div>
                </div>
                <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-expanded="true" aria-controls="sidebar" title="Recolher menu">
                    <span class="sidebar-toggle-icone" aria-hidden="true">‹</span>
                </button>
            </div>
            <div class="sidebar-botoes">
                <button id="novo" type="button" title="Novo roadmap">
                    <span class="sidebar-btn-icone" aria-hidden="true">+</span>
                    <span class="sidebar-label">Novo</span>
                </button>
                <button id="importar-json" type="button" class="btn-importar" title="Importar roadmap via JSON">
                    <span class="sidebar-btn-icone" aria-hidden="true">⤓</span>
                    <span class="sidebar-label">JSON</span>
                </button>
            </div>
            <div class="sidebar-subabas" id="sidebar-subabas" aria-label="Grupos de roadmaps"></div>
            <ul id="lista-roadmaps"></ul>
        </aside>
        <main class="roadmap">
            <div class="roadmap-conteudo" id="roadmap-conteudo"></div>
        </main>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modal-titulo"></h2>
            <form id="modal-form"></form>
            <div class="modal-acoes">
                <button type="button" class="btn-secundario" id="modal-cancelar">Cancelar</button>
                <button type="submit" form="modal-form" class="btn-primario">Salvar</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
