<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motor IR — Teste</title>
  <link rel="stylesheet" href="/main.css">
  <link rel="stylesheet" href="/ir-test.css">
</head>
<body>
  <div class="ir-page">
    <header class="ir-header">
      <div>
        <h1>Motor IR — Teste</h1>
        <p class="ir-subtitle">Information Retrieval determinístico (sem IA)</p>
      </div>
      <a href="/" class="btn-secundario">← Voltar ao sistema</a>
    </header>

    <div class="ir-grid">
      <section class="ir-panel ir-panel-input">
        <h2>Entrada da tarefa</h2>

        <div class="ir-actions-top">
          <button type="button" id="btn-exemplo" class="btn-sm btn-secundario">Exemplo Laravel Middleware</button>
          <select id="select-roadmap" class="ir-select">
            <option value="">Carregar tarefa do roadmap…</option>
          </select>
        </div>

        <label class="ir-label">
          Título
          <input type="text" id="input-titulo" placeholder="Middlewares no Laravel">
        </label>

        <label class="ir-label">
          Descrição
          <textarea id="input-descricao" rows="3" placeholder="Aprender ciclo de requisição, middleware…"></textarea>
        </label>

        <label class="ir-label">
          Subtarefas (uma por linha)
          <textarea id="input-subtarefas" rows="4" placeholder="Criar middleware&#10;Registrar middleware"></textarea>
        </label>

        <fieldset class="ir-fieldset">
          <legend>Providers</legend>
          <div id="providers-checkboxes" class="ir-checkboxes"></div>
        </fieldset>

        <label class="ir-label">
          Máx. resultados
          <input type="number" id="input-max-results" value="20" min="1" max="50">
        </label>

        <button type="button" id="btn-buscar" class="btn-primario ir-btn-buscar">Buscar recursos</button>
        <p id="status-msg" class="ir-status" hidden></p>
      </section>

      <section class="ir-panel ir-panel-debug">
        <h2>
          Debug do pipeline
          <button type="button" id="btn-toggle-debug" class="btn-sm btn-secundario">Recolher</button>
        </h2>
        <div id="debug-content" class="ir-debug-content">
          <p class="ir-vazio">Execute uma busca para ver o pipeline.</p>
        </div>
      </section>

      <section class="ir-panel ir-panel-results">
        <h2>Resultados <span id="results-count" class="ir-badge">0</span></h2>
        <div id="meta-info" class="ir-meta" hidden></div>
        <div id="errors-info" class="ir-errors" hidden></div>
        <div id="results-container">
          <p class="ir-vazio">Nenhum resultado ainda.</p>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="/js/ir-test.js"></script>
</body>
</html>
